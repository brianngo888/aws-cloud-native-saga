apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: "{{ .Release.Name }}"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}"}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: order
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          ports: [{containerPort: 8080}]
          env:
            - {name: R2DBC_URL, value: "{{ .Values.r2dbcUrl }}"}
            - {name: SAGA_ARN, value: "{{ .Values.sagaArn }}"}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: order-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: order-db, key: password}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 30}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
