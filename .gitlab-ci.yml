stages: [validate, test, build, scan, publish, deploy]
variables:
  AWS_REGION: us-east-2
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  script:
    - cd infrastructure/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
unit_test:
  stage: test
  image: gradle:9.2.1-jdk25
  script: ["cd services/order-service && gradle --no-daemon test"]
container_build:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables: {DOCKER_HOST: "tcp://docker:2376", DOCKER_TLS_CERTDIR: "/certs", DOCKER_TLS_VERIFY: "1", DOCKER_CERT_PATH: "/certs/client"}
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA" services/order-service
    - docker save "$CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA" -o image.tar
  artifacts: {paths: [image.tar], expire_in: 1 day}
container_scan:
  stage: scan
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
  needs: [{job: container_build, artifacts: true}]
# Publish/deploy are intentionally disabled until AWS GitLab OIDC trust, ECR, DB, and EKS Pod Identity are configured.
# Do not replace these with static AWS access keys. See docs/06-CICD-SECURITY.md.
